[package]
name = "trim-playlist"
version = "0.3.2"
description = "Trim Playlist — keep a playlist, download or trim a video URL"
edition = "2021"

[lib]
name = "trim_playlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
