<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trim Playlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand card animate-fade-up">
        <div class="brand-icon bg-brand-gradient" data-icon="music"></div>
        <div>
          <div class="app-switch"><button class="btn btn-ghost" id="appSwitch" aria-expanded="false" aria-haspopup="menu"><span id="appTitle">Trim Playlist</span><span data-icon="chevron-down"></span></button><div id="appMenu" class="app-menu" role="menu" hidden><button class="btn btn-ghost" data-view="playlist" role="menuitem">Trim Playlist</button><button class="btn btn-ghost" data-view="url" role="menuitem">Trim URL</button></div></div>
          <p class="muted">Your playlists</p>
        </div>
      </div>

      <div class="card panel animate-fade-up" style="animation-delay: 60ms">
        <div class="section-head">
          <h2>Playlists</h2>
          <button class="btn btn-ghost btn-sm" id="newPlaylistBtn">+ New</button>
        </div>
        <div class="scroll-list" id="playlistList"></div>
      </div>
    </aside>

    <section class="library animate-fade-up" style="animation-delay: 40ms">
      <div class="card animate-fade-up">
        <div class="section-head">
          <div>
            <p class="label">Playlist</p>
            <h2 id="playlistName">Select or create a playlist</h2>
          </div>
          <div class="row gap-2">
            <button class="btn btn-outline btn-sm" id="renamePlaylistBtn" disabled>Rename</button>
            <button class="btn btn-danger btn-sm" id="deletePlaylistBtn" disabled>Delete</button>
          </div>
        </div>
      </div>

      <div class="card animate-fade-up" style="animation-delay: 50ms">
        <h3 class="section-title">Add track</h3>
        <label class="field">
          <span class="field-label">Track name</span>
          <input class="input" type="text" id="trackTitle" placeholder="Song name (optional)">
        </label>
        <label class="field">
          <span class="field-label">Pick file from your PC</span>
          <div class="file-upload" id="fileUploadZone" tabindex="0" role="button">
            <div class="file-upload-icon" data-icon="upload"></div>
            <p class="file-upload-title" id="fileUploadTitle">Drop files or click to upload</p>
            <p class="muted file-upload-hint">Select multiple · MP3, MP4, M4A, WEBM, MKV, WAV, OGG, FLAC</p>
          </div>
          <input class="sr-only" type="file" id="fileInput" multiple accept="audio/*,video/*,.mp3,.mp4,.m4a,.webm,.mkv,.wav,.ogg,.flac">
          <ul class="file-list" id="fileList"></ul>
        </label>
        <p class="or">or</p>
        <label class="field">
          <span class="field-label">File path</span>
          <input class="input" type="text" id="filePath" placeholder="C:\Users\you\Music\song.mp3">
        </label>
        <button class="btn btn-primary w-full" id="addTrackBtn" disabled>Add to playlist</button>
      </div>

      <div class="card grow panel animate-fade-up" style="animation-delay: 80ms">
        <div class="section-head">
          <h2>Tracks</h2>
          <span class="muted drag-hint"><span data-icon="grip" data-icon-class="icon-sm"></span> drag to reorder</span>
        </div>
        <div class="scroll-list track-list" id="trackList"></div>
      </div>
    </section>

    <main class="player-stage">
      <div class="video-stage" id="videoStage">
        <video id="video" playsinline></video>
        <div class="audio-art" id="audioArt">
          <div class="vinyl"></div>
          <div class="note audio-note" data-icon="music"></div>
        </div>
        <div class="video-toolbar">
          <div class="dropdown" id="qualityDropdown">
            <button class="btn btn-outline btn-sm dropdown-trigger" id="qualityTrigger" aria-expanded="false">
              <span id="qualityLabel">Source</span>
              <span class="dropdown-chevron" data-icon="chevron-down"></span>
            </button>
            <div class="dropdown-menu" id="qualityMenu"></div>
          </div>
          <button class="btn btn-outline btn-sm btn-with-icon" id="fullscreenBtn" title="Fullscreen">
            <span data-icon="maximize"></span>
            <span>Fullscreen</span>
          </button>
        </div>
        <div class="quality-warn" id="qualityWarn" hidden>
          Low resolution file. Re-cut with <code>python cut_url.py --config setlist.json --quality 720</code>
        </div>
      </div>

      <div class="player-bar card">
        <div class="now-row">
          <div>
            <p class="label">Now playing</p>
            <h2 id="nowTitle">Select a track</h2>
            <p id="nowMeta" class="muted">MP3 / MP4 supported</p>
          </div>
          <span class="badge badge-brand" id="nowBadge">Ready</span>
        </div>

        <div class="progress-row">
          <span class="time" id="timeCurrent">0:00</span>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill bg-brand-gradient" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
          <span class="time" id="timeTotal">0:00</span>
        </div>

        <div class="transport">
          <button class="btn btn-ghost icon-only" id="shuffleBtn" title="Shuffle"></button>
          <button class="btn btn-ghost icon-only" id="prevBtn" title="Previous"></button>
          <button class="btn btn-primary play-main icon-only" id="playBtn" title="Play"></button>
          <button class="btn btn-ghost icon-only" id="nextBtn" title="Next"></button>
          <button class="btn btn-ghost icon-only repeat-off" id="repeatBtn" title="Repeat off"></button>
        </div>

        <div class="volume-row">
          <span class="volume-icon muted" id="volumeIcon"></span>
          <div class="progress-track slim" id="volumeTrack">
            <div class="progress-fill bg-brand-gradient" id="volumeFill"></div>
            <div class="progress-thumb" id="volumeThumb"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toastHost" class="toast-host"></div>
  <audio id="audio"></audio>
  <script type="module" src="app.js"></script>
<script type="module" src="downloads.js"></script>
</body>
</html>
