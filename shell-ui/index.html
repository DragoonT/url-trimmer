<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trim Playlist</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0f; color: #c9d2e3;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .box { text-align: center; user-select: none; }
    .spinner {
      width: 42px; height: 42px; margin: 0 auto 18px;
      border: 4px solid #23283a; border-top-color: #6c8cff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    #status { font-size: 13px; color: #8791a7; min-height: 18px; }
    #status.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Trim Playlist</h1>
    <div id="status">Starting…</div>
  </div>
  <script>
    (function () {
      var status = document.getElementById("status");
      var tries = 0;
      function say(text, isError) {
        status.textContent = text;
        status.className = isError ? "error" : "";
      }
      function tick() {
        tries++;
        var url;
        try {
          url = window.__TAURI__.core.invoke("server_url");
        } catch (e) {
          say("Shell error: " + e, true);
          return;
        }
        url.then(function (value) {
          if (value) {
            say("Opening…");
            location.replace(value);
            return;
          }
          if (tries > 240) {
            say("Server did not start. Close this window and open Trim Playlist again.", true);
            return;
          }
          say("Starting the Trim Playlist server…");
          setTimeout(tick, 250);
        }).catch(function (e) {
          say("Server error: " + e, true);
        });
      }
      tick();
    })();
  </script>
</body>
</html>
