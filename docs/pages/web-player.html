<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Trim Playlist Web Player</title><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#0e131c;color:#eef2f8;font:16px/1.6 system-ui,sans-serif}main{width:min(540px,calc(100% - 40px));padding:32px;border:1px solid #293341;border-radius:16px;background:#171c25}h1{margin-top:0}p{color:#a9b5c7}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #42516a;border-radius:8px;background:#0e131c;color:#fff;font:inherit}button{margin-top:14px;padding:11px 16px;border:0;border-radius:8px;background:#2876ff;color:#fff;font:inherit;font-weight:700}.error{color:#ff9c9c;min-height:1.6em}</style></head><body><main><h1>Open the web player</h1><p>Run <strong>player\start-mobile-web.bat</strong> on the Windows PC first. Connect your phone to the same Wi-Fi, then enter the address displayed by the launcher.</p><form id="connect"><label for="server">Trim Playlist server address</label><input id="server" inputmode="url" placeholder="http://192.168.1.25:8765" autocomplete="url" required><button>Open full player</button><p class="error" id="error"></p></form></main><script>const form=document.getElementById('connect'),field=document.getElementById('server'),error=document.getElementById('error');field.value=localStorage.trimPlaylistServer||'';form.addEventListener('submit',event=>{event.preventDefault();let url=field.value.trim();if(!/^https?:\/\//i.test(url))url='http://'+url;try{const parsed=new URL(url);if(!parsed.hostname){throw new Error()}localStorage.trimPlaylistServer=parsed.origin;location.assign(parsed.origin+'/')}catch{error.textContent='Enter an address such as http://192.168.1.25:8765';}});</script></body></html>
